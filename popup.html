<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>AI Agent Element Selector</title>
  <style>
    :root {
      --bg-color: #0b0f19;
      --card-bg: rgba(17, 24, 39, 0.7);
      --primary-grad: linear-gradient(135deg, #6366f1, #3b82f6);
      --primary-hover: linear-gradient(135deg, #4f46e5, #2563eb);
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
      --border-color: rgba(255, 255, 255, 0.08);
      --glow-color: rgba(99, 102, 241, 0.15);
    }

    body {
      width: 280px;
      margin: 0;
      padding: 16px;
      background-color: var(--bg-color);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: var(--text-main);
      box-sizing: border-box;
    }

    .container {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .header {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .logo-container {
      width: 28px;
      height: 28px;
      border-radius: 6px;
      background: var(--primary-grad);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 10px var(--glow-color);
    }

    .logo-icon {
      font-size: 14px;
      color: white;
      font-weight: bold;
    }

    .title {
      font-size: 14px;
      font-weight: 600;
      margin: 0;
      background: linear-gradient(135deg, #ffffff, #a5b4fc);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .btn-select {
      background: var(--primary-grad);
      color: white;
      border: none;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 550;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.2s ease;
      box-shadow: 0 4px 10px rgba(99, 102, 241, 0.25);
    }

    .btn-select:hover {
      background: var(--primary-hover);
      transform: translateY(-1px);
      box-shadow: 0 5px 12px rgba(99, 102, 241, 0.35);
    }

    .info {
      font-size: 11px;
      color: var(--text-muted);
      margin: 0;
      line-height: 1.4;
      text-align: center;
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 8px;
    }

    .info span {
      color: var(--text-main);
      font-weight: 500;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="logo-container">
        <span class="logo-icon">🤖</span>
      </div>
      <h1 class="title">AI Element Selector</h1>
    </div>

    <button id="start-inspect" class="btn-select">
      <span>🔍</span> Начать выбор элемента
    </button>

    <p class="info">
      Кликните на элемент для добавления аннотации. Быстрый запуск: <span>Ctrl + Shift + S</span>.
    </p>
  </div>
  <script src="popup.js"></script>
</body>
</html>
